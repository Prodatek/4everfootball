# Quick-deploy reverse proxy for public testing. Three subdomains, one
# multi-SAN Let's Encrypt cert (requested with all three names, so the same
# fullchain/privkey pair under the first domain's live/ dir covers all of
# them). See infrastructure/README.md for the certbot bootstrap steps this
# depends on before nginx can start successfully.
#
# This stands in for the eventual ALB/ECS deploy in infrastructure/ — it's
# intentionally simple (single box, one nginx, no blue/green) since its only
# job is to give public testers a working HTTPS URL.

# Plain-HTTP: only used for the ACME HTTP-01 challenge and to redirect real
# traffic up to HTTPS. Must stay on port 80 for certbot renewals to keep working.
server {
    listen 80;
    server_name 4ever.buildspecs.io api.4ever.buildspecs.io media.4ever.buildspecs.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Web UI (Next.js)
server {
    listen 443 ssl;
    server_name 4ever.buildspecs.io;

    ssl_certificate /etc/letsencrypt/live/4ever.buildspecs.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4ever.buildspecs.io/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API + live-match Socket.IO (namespace /live, transport path /socket.io/ —
# both served by the same Nest HTTP server, so one location block covers
# both; the Upgrade/Connection headers only take effect on requests that
# actually ask for a websocket upgrade, so plain REST calls are unaffected).
server {
    listen 443 ssl;
    server_name api.4ever.buildspecs.io;

    ssl_certificate /etc/letsencrypt/live/4ever.buildspecs.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4ever.buildspecs.io/privkey.pem;

    location / {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live scores are long-lived websocket connections — the default 60s
        # read timeout would silently drop idle-but-open sockets.
        proxy_read_timeout 3600s;
    }
}

# MinIO S3 API — browsers PUT directly here using presigned URLs the API
# hands out (S3_ENDPOINT/S3_PUBLIC_URL must point here, see infra README).
server {
    listen 443 ssl;
    server_name media.4ever.buildspecs.io;

    ssl_certificate /etc/letsencrypt/live/4ever.buildspecs.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4ever.buildspecs.io/privkey.pem;

    client_max_body_size 25m;
    # Presigned PUTs are signed over the raw body; buffering the whole
    # upload in nginx first before forwarding just adds latency for no benefit.
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
