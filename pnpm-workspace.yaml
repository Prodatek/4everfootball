packages:
  - "apps/*"
  - "packages/*"
# pnpm 11 defaults to a 1-day minimum-release-age check, re-verifying every
# lockfile entry's publish date against the registry before install. That's
# a real protection for a normal `pnpm install` that might resolve a
# brand-new (possibly compromised) version, but our Docker builds use
# --frozen-lockfile — nothing gets re-resolved, only what's already pinned
# in pnpm-lock.yaml gets installed — so the check adds a slow, low-value
# metadata round-trip per package with no corresponding benefit. Disabled
# here rather than only in CI/Docker so `pnpm install` behaves the same
# everywhere.
minimumReleaseAge: 0
# pnpm 11 also raised the default network concurrency to
# min(96, max(cpuCores*3, 64)) — fine on a normal connection, but on this
# connection (single requests already take 14-45s to registry.npmjs.org)
# that many requests in flight at once causes contention that pushes some
# requests past the default 60s fetch timeout, aborting the whole install
# late (e.g. failing on package 910/915 after everything else succeeded).
# Lower concurrency so requests aren't fighting each other, and give the
# ones that do go through more time/retries before giving up.
networkConcurrency: 4
fetchTimeout: 900000
fetchRetries: 8
fetchRetryFactor: 2
fetchRetryMintimeout: 15000
fetchRetryMaxtimeout: 90000
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  sharp: true
  unrs-resolver: true
