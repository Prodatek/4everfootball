services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fourever
      POSTGRES_PASSWORD: fourever
      POSTGRES_DB: fourever
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # api-migrate is a one-shot with no connection-retry logic of its own —
    # without this, "docker compose up" can race it against postgres still
    # starting up and fail on the very first run.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourever -d fourever"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.9
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: dev_meili_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fourever
      MINIO_ROOT_PASSWORD: fourever123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data

  # One-shot helper: creates the media bucket and makes it publicly readable
  # (uploaded images are served directly by MinIO, no presigned GET needed).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 fourever fourever123; do sleep 1; done;
      mc mb --ignore-existing local/media;
      mc anonymous set download local/media;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      # Override the .env's localhost URLs with in-network service hostnames
      # — these two are correct regardless of local vs public-deploy use,
      # since the api container itself talks to postgres/meilisearch over
      # the compose network either way.
      #
      # WEB_APP_URL/S3_ENDPOINT/S3_PUBLIC_URL are deliberately NOT overridden
      # here: apps/api/.env's localhost values are what a human (or Postman)
      # on the host machine needs to actually reach this stack for manual
      # testing. createUploadUrl()'s presigned URLs embed whatever host
      # S3_ENDPOINT is set to — that has to be resolvable by whoever makes
      # the upload request, which for local testing is the host machine, not
      # the compose network. For the real public deploy, layer
      # docker-compose.public.yml on top instead of editing this file — see
      # its header comment.
      DATABASE_URL: "postgresql://fourever:fourever@postgres:5432/fourever?schema=public"
      MEILISEARCH_HOST: "http://meilisearch:7700"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully

  # One-shot: applies pending Prisma migrations against `postgres`. Targets the
  # `build` stage (not the pruned `runtime` image) because that's the one with
  # the `prisma` CLI still installed. Run explicitly with:
  #   docker compose run --rm api-migrate
  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: "postgresql://fourever:fourever@postgres:5432/fourever?schema=public"
    working_dir: /repo
    entrypoint: ["pnpm", "--filter", "@4ef/api", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  # Prisma Studio on its default port, browsing whatever `postgres` currently
  # holds. Also targets `build` for the same reason as api-migrate above.
  prisma-studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: "postgresql://fourever:fourever@postgres:5432/fourever?schema=public"
    working_dir: /repo
    entrypoint:
      ["pnpm", "--filter", "@4ef/api", "exec", "prisma", "studio", "--port", "5555", "--browser", "none"]
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time — must be reachable from
        # the browser, not from inside the compose network. localhost:4000 is
        # correct for local docker compose use (api's port is published to
        # the host). For a public deploy, layer docker-compose.public.yml on
        # top instead of editing this file.
        NEXT_PUBLIC_API_URL: "http://localhost:4000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Public-testing reverse proxy — see infrastructure/README.md for the
  # one-time certbot bootstrap this depends on before nginx can start (it
  # fails to boot if the certs it references in conf.d/ don't exist yet).
  # Stands in for the eventual ALB/ECS deploy in infrastructure/, not a
  # replacement for it. Excluded from a plain `docker compose up` (no local
  # TLS certs exist) — start with `docker compose --profile public up`.
  nginx:
    image: nginx:1.27-alpine
    profiles: ["public"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
      - minio

  # Renews the Let's Encrypt cert twice a day; does NOT reload nginx after
  # renewal (see infra README) — this is a quick-deploy stand-in, not
  # production automation.
  certbot:
    image: certbot/certbot:latest
    profiles: ["public"]
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:
  certbot_www:
  certbot_certs:
